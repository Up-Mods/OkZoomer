plugins {
	id 'java-library'
	id 'maven-publish'
}

def javaVersion = 21

static String createVersionString() {
	def ENV = System.getenv()
	return ENV.TAG ?: "0.0.0-development${(!ENV.TAG && ENV.BUILD_NUMBER) ? "-build.${ENV.BUILD_NUMBER}" : ''}"
}

version = createVersionString()
group = 'io.github.ennuil.ok_zoomer'

java {
	withSourcesJar()
	if (JavaVersion.current() < JavaVersion.toVersion(javaVersion)) {
		toolchain {
			languageVersion.set(JavaLanguageVersion.of(javaVersion))
		}
	}
}

compileJava {
	options.release = javaVersion
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "ParchmentMC"
				url = "https://maven.parchmentmc.org"
			}
		}
		filter {
			includeGroupAndSubgroups("org.parchmentmc")
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Up's Mods"
				url = "https://maven.uuid.gg/releases"
			}
		}
		filter {
			includeGroup("page.langeweile.wrench_wrapper")
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Quilt"
				url = "https://maven.quiltmc.org/repository/release"
			}
		}
		filter {
			includeGroupAndSubgroups("org.quiltmc")
		}
	}
	mavenCentral()
}

jar {
	def licenseFile = rootProject.file('LICENSE.md')
	inputs.files(licenseFile)

	from(licenseFile) {
		rename { "LICENSE_ok_zoomer.md" }
	}
}

sourcesJar {
	def licenseFile = rootProject.file('LICENSE.md')
	inputs.files(licenseFile)

	from(licenseFile) {
		rename { "LICENSE_ok_zoomer.md" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(javaVersion)
}

publishing {
	def ENV = System.getenv()
	afterEvaluate {
		publications {
			"mavenJava${project.name}"(MavenPublication) {
				artifactId base.archivesName.get()
				from components.java
			}
		}
	}

	repositories {
		if (ENV.MAVEN_UPLOAD_URL) {
			maven {
				url = ENV.MAVEN_UPLOAD_URL
				credentials {
					username = ENV.MAVEN_UPLOAD_USERNAME
					password = ENV.MAVEN_UPLOAD_PASSWORD
				}
			}
		}
	}
}
