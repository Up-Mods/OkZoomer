plugins {
	id 'mod_conventions_common'
	alias libs.plugins.fabric.loom
}

base.archivesName = 'ok_zoomer-common'

// All the dependencies are declared at gradle/libs.version.toml and referenced with "libs.<id>"
// See https://docs.gradle.org/current/userguide/platforms.html for information on how version catalogs work.
dependencies {
	minecraft libs.minecraft
	//mappings loom.officialMojangMappings()
	mappings(loom.layered {
		it.officialMojangMappings()
		it.parchment "org.parchmentmc.data:parchment-${libs.versions.parchment.minecraft.get()}:${libs.versions.parchment.mappings.get()}"
	})
	modImplementation libs.fabric.loader
	compileOnly libs.wrench.wrapper.api.fabric
}

loom {
	mixin {
		useLegacyMixinAp = false
	}

	mods {
		'ok_zoomer' {
			sourceSet('main')
		}
	}
}
