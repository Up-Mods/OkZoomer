[versions]
minecraft = "26.3"

shadow = "9.6.1"
mod_publish_plugin = "2.2.0"

fabric_loom = "1.18.1"
fabric_loader = "0.19.5"
moddevgradle = "2.0.147"
neoforge = "26.3.0.0-beta"

fabric_api = "0.160.5+26.3"
wrench_wrapper = "0.9.3"

modmenu = "21.0.0-beta.1"
sodium = "0.9.2+mc26.3"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }

fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }
wrench_wrapper_api_fabric = { module = "page.langeweile.wrench_wrapper:ww_api_fabric", version.ref = "wrench_wrapper" }
wrench_wrapper_api_neoforge = { module = "page.langeweile.wrench_wrapper:ww_api_neoforge", version.ref = "wrench_wrapper" }
wrench_wrapper_impl = { module = "page.langeweile.wrench_wrapper:ww_impl", version.ref = "wrench_wrapper" }

modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
sodium_fabric = { module = "net.caffeinemc:sodium-fabric-api", version.ref = "sodium" }
sodium_neoforge = { module = "net.caffeinemc:sodium-neoforge-api", version.ref = "sodium" }

# If you have multiple similar dependencies, you can declare a dependency bundle and reference it on the build script with "libs.bundles.example".
[bundles]
wrench_wrapper_fabric = ["wrench_wrapper_api_fabric", "wrench_wrapper_impl"]
wrench_wrapper_neoforge = ["wrench_wrapper_api_neoforge", "wrench_wrapper_impl"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
mod_publish_plugin = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod_publish_plugin" }
fabric_loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric_loom" }
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
